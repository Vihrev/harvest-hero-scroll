<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>actiTIME hero block — demo</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Example only: the hero section belongs to the site. Use the site's own type, buttons and container. */
  body { margin: 0; font-family: "Montserrat", sans-serif; color: #0d1e40; background: #fff; }
  .hero {
    padding: 72px 16px 48px; text-align: center;
    /* page background from the Figma 'Bg' layer: soft lilac radial + white wash + faint 1px stripes */
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.5) 0 1px, transparent 1px 6px),
      linear-gradient(180deg, #fff 31.4%, rgba(255,255,255,.24) 66.8%),
      radial-gradient(ellipse 69.4% 63.3% at 49% 36.7%, #fff 0%, #f2ddff 100%) #f2ddff;
  }
  .hero h1 { margin: 0 auto; max-width: 1200px; font-size: clamp(32px, 4.2vw, 60px); line-height: 1.25; font-weight: 700; }
  .hero p { margin: 22px auto 0; max-width: 640px; font-size: clamp(16px, 1.4vw, 20px); line-height: 1.5; font-weight: 500; }
  .ctas { margin-top: 34px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; height: 52px; padding: 0 30px; border-radius: 26px; font-weight: 600; font-size: 16px; text-decoration: none; }
  .btn--main { background: #3dbb5d; color: #fff; }
  .btn--ghost { border: 1.5px solid #0d1e40; color: #0d1e40; }
  .hero__demo { max-width: 1640px; margin: 24px auto 0; }
</style>
</head>
<body>
  <section class="hero">
    <h1>actiTIME vs Harvest:<br>better features for half the price</h1>
    <p>See how actiTIME compares to Harvest and why thousands of teams are making the switch.</p>
    <div class="ctas"><a class="btn btn--main" href="#">Start free trial</a><a class="btn btn--ghost" href="#">Book a demo</a></div>

    <!-- the block -->
    <div class="hero__demo">
      <actitime-hero-demo hold="3"></actitime-hero-demo>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="actitime-hero-demo.js" defer></script>
</body>
</html>
